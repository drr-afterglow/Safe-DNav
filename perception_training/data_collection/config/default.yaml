headless: true
device: cuda:0
seed: 0

drone:
  model_name: hummingbird

sim:
  dt: 0.016
  substeps: 1
  gravity: [0, 0, -9.81]
  replicate_physics: false
  use_flatcache: true
  use_gpu_pipeline: true
  device: cuda:0
  solver_type: 1
  use_gpu: true
  bounce_threshold_velocity: 0.2
  friction_offset_threshold: 0.04
  friction_correlation_distance: 0.025
  enable_stabilization: true
  enable_scene_query_support: true
  gpu_max_rigid_contact_count: 524288
  gpu_max_rigid_patch_count: 163840
  gpu_found_lost_pairs_capacity: 4194304
  gpu_found_lost_aggregate_pairs_capacity: 33554432
  gpu_total_aggregate_pairs_capacity: 4194304
  gpu_max_soft_body_contacts: 1048576
  gpu_max_particle_contacts: 1048576
  gpu_heap_capacity: 67108864
  gpu_temp_buffer_capacity: 16777216
  gpu_max_num_partitions: 8

sensor:
  model: mid360
  lidar_range: 10.0
  min_range: 0.1
  vfov_deg: [-7.0, 52.0]
  sampling:
    profile: mid360_nonrepetitive_approx
    nominal_point_rate_hz: 200000
    scan_duration: 0.096
    # A compute-aware low-discrepancy subset of the nominal 19200 points. It
    # preserves the full FOV/time distribution; tune it against real bag data.
    simulated_points_per_frame: 5760
    return_dropout_prob: 0.02
    range_noise_std_m: 0.02
  # Orbit's RayCaster requires a fixed-size bootstrap pattern. These angles
  # only allocate its 5760-ray buffer; every capture replaces the directions
  # with a temporally varying non-repetitive MID-360 approximation.
  raycast_proxy:
    horizontal_beams: 360
    vertical_angles_deg:
      [-7.0, -3.0667, 0.8667, 4.8, 8.7333, 12.6667, 16.6, 20.5333,
       24.4667, 28.4, 32.3333, 36.2667, 40.2, 44.1333, 48.0667, 52.0]
  network_panorama_height: 16
  network_panorama_width: 180
  rl_panorama_height: 6
  rl_panorama_width: 36

env:
  num_envs: 128
  max_episode_length: 1000000
  env_spacing: 0.0
  map_range: [20.0, 20.0, 4.5]
  num_static_obstacles: 200
  static_seed: 10
  static_width_range: [0.4, 1.0]
  static_height_range: [2.0, 4.0, 4.0, 4.5]
  static_height_probability: [0.1, 0.3, 0.6]
  debug_vis: false

viewer:
  eye: [0.0, -30.0, 18.0]
  lookat: [0.0, 0.0, 2.0]
  resolution: [1280, 720]

env_dyn:
  num_obstacles: 120
  vel_range: [0.5, 1.5]
  max_accel: 2.0
  size_range: [0.25, 0.65]
  local_range: [6.0, 3.0]

collection:
  scene_id: 10
  num_samples: 20000
  output_dir: perception_training/data/mid360_random_pose
  overwrite_output: true
  force_exit_after_success: true
  close_sim_app: false
  shard_size: 2048
  warmup_steps: 64
  # Randomized interval: 6..9 simulation steps = 0.096..0.144 s.
  steps_between_frames_range: [6, 9]
  valid_delta_t_range: [0.05, 0.15]
  randomize_pose_each_sample: true
  pose_xy_range: [18.0, 18.0]
  pose_z_range: [0.8, 3.5]
  randomize_roll_pitch: true
  max_roll_pitch_deg: 8.0
  sensor_motion:
    enabled: true
    # Retain static-sensor pairs as hard negatives and compensation controls.
    static_ratio: 0.15
    linear_speed_range: [0.0, 2.5]
    angular_rate_deg_s: [0.0, 90.0]
    linear_accel_range: [0.0, 1.5]
    angular_accel_deg_s2: [0.0, 60.0]
  alignment_noise:
    position_std_m: 0.01
    rotation_std_deg: 0.2
  min_dynamic_pixels: 1
  keep_empty_ratio: 0.05
  dyn_max_vel: 5.0
  log_interval: 10
